services:
  property-postgres:
    image: postgres:17
    container_name: stayhub-property-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: stayhub
      POSTGRES_PASSWORD: stayhub_dev_password
      POSTGRES_DB: property_db

    ports:
      - "5432:5432"

    volumes:
      - property_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U stayhub -d property_db
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  property_postgres_data:
